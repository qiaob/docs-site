# Lint, test (SQLite and PostgreSQL), build the image. GitHub-hosted runners, uv.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run black --check packages
      - run: uv run isort --check-only packages
      - run: uv run ruff check packages

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docstate
          POSTGRES_PASSWORD: docstate
          POSTGRES_DB: docstate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docstate" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest -q
        env:
          DOCSTATE_TEST_DB_PATH: /tmp/docstate-test.db
          DOCSTATE_TEST_POSTGRES_URL: postgresql://docstate:docstate@localhost:5432/docstate

  image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: docstate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
