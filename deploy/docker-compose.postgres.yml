# Docstate + PostgreSQL. Put a login proxy in front and set DOCSTATE_AUTH_MODE=header.
#   DB_PASSWORD=... AGENT_TOKEN=... docker compose -f deploy/docker-compose.postgres.yml up -d
services:
  docstate:
    image: ghcr.io/qiaob/docs-site:latest
    ports:
      - "8787:8787"
    environment:
      DOCSTATE_STORAGE_URL: postgresql://docstate:${DB_PASSWORD}@db:5432/docstate
      DOCSTATE_BASE_URL: ${BASE_URL:-http://localhost:8787}
      DOCSTATE_AUTH_MODE: ${AUTH_MODE:-none}
      DOCSTATE_AUTH_HEADER: ${AUTH_HEADER:-X-Forwarded-Email}
      DOCSTATE_API_TOKENS: agent:${AGENT_TOKEN}
      DOCSTATE_SITE_TITLE: ${SITE_TITLE:-Docstate}
      DOCSTATE_LANG: ${LANG_UI:-en}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docstate
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: docstate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docstate"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
