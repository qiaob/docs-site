[project]
name = "docstate-mcp"
version = "0.1.0"
description = "MCP server for Docstate: let AI agents publish and read documents on a Docstate site."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "documentation", "publishing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Documentation",
]
dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.27",
]

[project.scripts]
docstate-mcp = "docstate_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/qiaob/docs-site"
Documentation = "https://github.com/qiaob/docs-site/blob/main/docs/mcp.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docstate_mcp"]
