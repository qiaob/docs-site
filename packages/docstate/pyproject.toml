[project]
name = "docstate"
version = "0.1.0"
description = "Publish Markdown and interactive HTML as versioned documents that remember state. Self-hosted."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["documentation", "publishing", "html", "markdown", "mcp", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
]
dependencies = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "linkify-it-py>=2.0",
    "pygments>=2.18",
    "python-frontmatter>=1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# database drivers: SQLite needs nothing
postgres = ["psycopg[binary]>=3.2"]
mysql = ["pymysql>=1.1"]
# the GitHub write-back authenticates as a GitHub App (RS256 app JWT)
github = ["PyJWT[crypto]>=2.8"]

[project.scripts]
docstate = "docstate.cli:main"

[project.entry-points."docstate.storage"]
sql = "docstate.storage.sql:open_sql_storage"
memory = "docstate.storage.memory:open_memory_storage"

[project.urls]
Homepage = "https://github.com/qiaob/docs-site"
Documentation = "https://github.com/qiaob/docs-site/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docstate"]
