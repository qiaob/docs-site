<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · {{ site_title }}</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin:0; background:#f5f5f2; color:#1a1a18; font:15px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue","Segoe UI",sans-serif; }
    .box { max-width:520px; margin:18vh auto 0; background:#fff; border:1px solid #e4e4df; border-radius:12px; padding:28px 32px; }
    h1 { font-size:20px; margin:0 0 10px; letter-spacing:-.01em; }
    p { margin:8px 0; color:#3d3d39; }
    a.btn { display:inline-block; margin-top:14px; padding:8px 14px; border-radius:8px; background:#2a67b1; color:#fff; text-decoration:none; font-size:14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    {% if login_url %}<a class="btn" href="{{ login_url }}">{{ t('go_login') }}</a>{% endif %}
  </div>
</body>
</html>
