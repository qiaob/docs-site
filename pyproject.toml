# Workspace root: not a package itself (tool.uv.package = false). `uv sync` here
# installs both members in editable mode plus the dev tooling.
[project]
name = "docstate-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["docstate[postgres]", "docstate-mcp"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/docstate", "packages/docstate-mcp"]

[tool.uv.sources]
docstate = { workspace = true }
docstate-mcp = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "black>=24",
    "isort>=5.13",
    "ruff>=0.6",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["docstate", "docstate_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# conftest pins environment variables before importing the app
"packages/*/tests/conftest.py" = ["E402"]
# alembic's env.py runs at import time by design
"packages/docstate/src/docstate/storage/sql/alembic/env.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["docstate", "docstate_mcp"]

[tool.pytest.ini_options]
testpaths = ["packages/docstate/tests", "packages/docstate-mcp/tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
